[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eg4tool"
description = "Back up, diff and restore EG4-LL battery pack protection settings over RS232"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
eg4tool = "eg4tool.cli:main"

[project.gui-scripts]
eg4tool-gui = "eg4tool.gui:main"

[tool.setuptools.dynamic]
version = { attr = "eg4tool.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
