[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packkeeper"
description = "Back up, diff and restore battery pack BMS protection settings over RS232 (EG4-LL for now)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
packkeeper = "packkeeper.cli:main"

[project.gui-scripts]
packkeeper-gui = "packkeeper.gui:main"

[tool.setuptools.dynamic]
version = { attr = "packkeeper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
