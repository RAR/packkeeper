name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: ubuntu-22.04 # older glibc: the binary runs on more distributions
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[gui,dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/EG4 BMS Tool.exe", "dist/eg4tool.exe", README.md -DestinationPath "eg4tool-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir pkg
          ditto "dist/EG4 BMS Tool.app" "pkg/EG4 BMS Tool.app"
          cp dist/eg4tool README.md pkg/
          ditto -c -k --keepParent pkg "eg4tool-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir pkg
          cp "dist/EG4 BMS Tool" pkg/eg4-bms-tool
          cp dist/eg4tool README.md pkg/
          tar -czf "eg4tool-${{ matrix.name }}.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: eg4tool-${{ matrix.name }}
          path: eg4tool-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
