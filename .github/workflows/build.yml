name: build

# Pushes and pull requests only run the tests, on Linux (the cheapest runner).
# Builds run on a release tag (all platforms) or by hand:
#   gh workflow run build --ref main                      # Windows only
#   gh workflow run build --ref main -f platforms=all     # all four
# On a private repo macOS minutes count 10x and Windows 2x (a public repo's
# standard runners are free), so build only what is needed. A Windows build
# can also be made on a Windows PC with packaging\build-windows.bat, which
# uses no CI minutes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which builds
        type: choice
        options: [windows, all]
        default: windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[gui,dev]"

      - name: Test
        run: python -m pytest -q

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platforms == 'windows' && '[{"os":"windows-latest","name":"windows-x86_64"}]' || '[{"os":"windows-latest","name":"windows-x86_64"},{"os":"macos-14","name":"macos-arm64"},{"os":"macos-15-intel","name":"macos-x86_64"},{"os":"ubuntu-22.04","name":"linux-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[gui,dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/PackKeeper.exe", "dist/cli/packkeeper-cli.exe", README.md -DestinationPath "packkeeper-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir pkg
          ditto "dist/PackKeeper.app" "pkg/PackKeeper.app"
          cp dist/cli/packkeeper README.md pkg/
          ditto -c -k --keepParent pkg "packkeeper-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir pkg
          cp "dist/PackKeeper" pkg/packkeeper-gui
          cp dist/cli/packkeeper README.md pkg/
          tar -czf "packkeeper-${{ matrix.name }}.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: packkeeper-${{ matrix.name }}
          path: packkeeper-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
